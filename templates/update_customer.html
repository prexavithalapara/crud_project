{% extends "master.html" %}
{% load static %}
{% block content %}

    <div class="pagetitle">
      <h1>Form Elements</h1>
      <nav>
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a href="index.html">Home</a></li>
          <li class="breadcrumb-item">Forms</li>
          <li class="breadcrumb-item active">Elements</li>
        </ol>
      </nav>
    </div><!-- End Page Title -->

    <section class="section">
      <div class="row">
        <div class="col-lg-10">

          <div class="card">
            <div class="card-body">
              <h5 class="card-title">General Form Elements</h5>

              <!-- General Form Elements -->
              <form method="POST">
                {% csrf_token %}
                <div class="row mb-3">
                  <label for="inputText" class="col-sm-2 col-form-label">Name</label>
                  <div class="col-sm-10">
                    <input type="text" name="name"  value="{{customer.name}}" class="form-control">
                  </div>
                </div>
                <div class="row mb-3">
                  <label for="inputEmail" class="col-sm-2 col-form-label">customer_id</label>
                  <div class="col-sm-10">
                    <input type="unique" name="customer_id" value="{{customer.id}}" class="form-control">
                  </div>
                </div>
                <div class="row mb-3">
                  <label for="inputEmail" class="col-sm-2 col-form-label">phone</label>
                  <div class="col-sm-10">
                    <input type="number" name="phone" value="{{customer.phone}}" class="form-control">
                  </div>
                </div>
                <div class="row mb-3">
                  <label for="inputEmail" class="col-sm-2 col-form-label">email</label>
                  <div class="col-sm-10">
                    <input type="text" name="email" value="{{customer.email}}" class="form-control">
                  </div>
                </div>
                <div class="row mb-3">
                  <label for="inputEmail" class="col-sm-2 col-form-label">city</label>
                  <div class="col-sm-10">
                    <input type="text" name="city" value="{{customer.city}}" class="form-control">
                  </div>
               </div>
                <div class="row mb-3">
                  <label for="inputEmail" class="col-sm-2 col-form-label">state</label>
                  <div class="col-sm-10">
                    <input type="text" name="state" value="{{customer.state}}" class="form-control">
                  </div>
                </div>
                <div class="row mb-3">
                  <label for="inputEmail" class="col-sm-2 col-form-label">address</label>
                  <div class="col-sm-10">
                    <input type="text" name="address" value="{{customer.address}}" class="form-control">
                  </div>
                </div>
                <div class="row mb-3">
                  <label for="inputEmail" class="col-sm-2 col-form-label">register_date</label>
                  <div class="col-sm-10">
                    <input type="date" name="register_date" value="{{customer.date|date:'y-m-d'}}" class="form-control">
                  </div>
                </div>
                <div class="row mb-3">
                  <label for="inputEmail" class="col-sm-2 col-form-label">gender</label>
                  <div class="col-sm-10">
                    <input type="text" name="gender" value="{{customer.gender}}" class="form-control">
                  </div>
                </div>
                <div class="row mb-3">
                  <label class="col-sm-2 col-form-label">Submit Button</label>
                  <div class="col-sm-10">
                    <button type="submit" class="btn btn-primary">Submit Form</button>
                  </div>
                </div>

              </form><!-- End General Form Elements -->

            </div>
          </div>

        </div>
      </div>
    </section>

{% endblock %}
