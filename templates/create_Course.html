{% extends "master.html" %}
{% load static %}
{% block content %}

    <div class="pagetitle">
      <h1>Form Elements</h1>
      <nav>
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a href="index.html">Home</a></li>
          <li class="breadcrumb-item">Forms</li>
          <li class="breadcrumb-item active">Elements</li>
        </ol>
      </nav>
    </div><!-- End Page Title -->

    <section class="section">
      <div class="row">
        <div class="col-lg-10">

          <div class="card">
            <div class="card-body">
              <h5 class="card-title">General Form Elements</h5>

              <!-- General Form Elements -->
              <form method="POST">
                {% csrf_token %}
                <div class="row mb-3">
                  <label class="col-sm-2 col-form-label">teacher</label>
                  <div class="col-sm-10">
                    <select class="form-select" name="abc" aria-label="Default select example">
                      <option selected>Open this select menu</option>
                      {% for i in teach %}
                      <option value="{{i.id}}">{{i.name}}</option>
                      {% endfor %}
                    </select>
                  </div>
                </div>
                <div class="row mb-3">
                  <label for="inputText" class="col-sm-2 col-form-label">Name</label>
                  <div class="col-sm-10">
                    <input type="text" name="name" class="form-control">
                  </div>
                </div>
                <div class="row mb-3">
                  <label for="inputEmail" class="col-sm-2 col-form-label">course_code</label>
                  <div class="col-sm-10">
                    <input type="text" name="course_code" class="form-control">
                  </div>
                </div>
                <div class="row mb-3">
                  <label for="inputEmail" class="col-sm-2 col-form-label">duration</label>
                  <div class="col-sm-10">
                    <input type="time" name="duration" class="form-control">
                  </div>
                </div>
                <div class="row mb-3">
                  <label for="inputEmail" class="col-sm-2 col-form-label">fees</label>
                  <div class="col-sm-10">
                    <input type="number" name="fees" class="form-control">
                  </div>
                </div>
                <div class="row mb-3">
                  <label for="inputEmail" class="col-sm-2 col-form-label">syllabus</label>
                  <div class="col-sm-10">
                    <input type="text" name="syllabus" class="form-control">
                  </div>
                </div>
                <div class="row mb-3">
                  <label for="inputEmail" class="col-sm-2 col-form-label">created_date</label>
                  <div class="col-sm-10">
                    <input type="date" name="created_date" class="form-control">
                  </div>
                </div>
                <div class="row mb-3">
                  <label for="inputEmail" class="col-sm-2 col-form-label">update_date</label>
                  <div class="col-sm-10">
                    <input type="date" name="update_date" class="form-control">
                  </div>
                </div>

                <fieldset class="row mb-3">
                  <legend class="col-form-label col-sm-2 pt-0">status</legend>
                  <div class="col-sm-10">
                    <div class="form-check">
                      <input class="form-check-input" type="radio" name="status" id="gridRadios1" value="option1">
                      <label class="form-check-label" for="gridRadios1">
                        Active
                      </label>
                    </div>
                    <div class="form-check">
                      <input class="form-check-input" type="radio" name="status" id="gridRadios2" value="option2">
                      <label class="form-check-label" for="gridRadios2">
                        Inactive
                      </label>
                    </div>
                  </div>
                </fieldset>

                
                <fieldset class="row mb-3">
                  <legend class="col-form-label col-sm-2 pt-0">level</legend>
                  <div class="col-sm-10">
                    <div class="form-check">
                      <input class="form-check-input" type="radio" name="level" id="gridRadios3" value="option1">
                      <label class="form-check-label" for="gridRadios3">
                        Beginner
                      </label>
                    </div>
                    <div class="form-check">
                      <input class="form-check-input" type="radio" name="level" id="gridRadios4" value="option2">
                      <label class="form-check-label" for="gridRadios4">
                        Advanced
                      </label>
                    </div>
                  </div>
                </fieldset>
                <div class="row mb-3">
                  <label class="col-sm-2 col-form-label">Submit Button</label>
                  <div class="col-sm-10">
                    <button type="submit" class="btn btn-primary">Submit Form</button>
                  </div>
                </div>

              </form><!-- End General Form Elements -->

            </div>
          </div>

        </div>
      </div>
    </section>

{% endblock %}
