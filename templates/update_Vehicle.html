{% extends "master.html" %}
{% load static %}
{% block content %}

    <div class="pagetitle">
      <h1>Form Elements</h1>
      <nav>
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a href="index.html">Home</a></li>
          <li class="breadcrumb-item">Forms</li>
          <li class="breadcrumb-item active">Elements</li>
        </ol>
      </nav>
    </div><!-- End Page Title -->

    <section class="section">
      <div class="row">
        <div class="col-lg-10">

          <div class="card">
            <div class="card-body">
              <h5 class="card-title">General Form Elements</h5>

              <!-- General Form Elements -->
              <form method="POST">
                {% csrf_token %}
                <div class="row mb-3">
                  <label for="inputText" class="col-sm-2 col-form-label">Name</label>
                  <div class="col-sm-10">
                    <input type="text" name="name" value="{{Vehicle.name}}" class="form-control">
                  </div>
                </div>
                <div class="row mb-3">
                  <label for="inputEmail" class="col-sm-2 col-form-label">Vehicle_no</label>
                  <div class="col-sm-10">
                    <input type="unique" name="Vehicle_no" value="{{Vehicle.no}}" class="form-control">
                  </div>
                </div>
                <div class="row mb-3">
                  <label for="inputEmail" class="col-sm-2 col-form-label">model_name</label>
                  <div class="col-sm-10">
                    <input type="text" name="model_name" value="{{Vehicle.model_name}}" class="form-control">
                  </div>
                </div>
                <div class="row mb-3">
                  <label for="inputEmail" class="col-sm-2 col-form-label">brand</label>
                  <div class="col-sm-10">
                    <input type="text" name="brand" value="{{Vehicle.brand}}" class="form-control">
                  </div>
                </div>
                <div class="row mb-3">
                  <label for="inputEmail" class="col-sm-2 col-form-label">type</label>
                  <div class="col-sm-10">
                    <input type="text" name="type" value="{{Vehicle.type}}" class="form-control">
                    <select class="form-select"  aria-label="Default select example">
                      <option selected>Open this select menu</option>
                      <option value="1">Car</option>
                      <option value="2">Bike</option>
                      <option value="3">Van</option>
                    </select>
                  </div>
                </div>
                 <div class="row mb-3">
                  <label for="inputEmail" class="col-sm-2 col-form-label">address</label>
                  <div class="col-sm-10">
                    <input type="text" name="owner_name" value="{{Vehicle.owner_name}}" class="form-control">
                  </div>
                </div>
                <div class="row mb-3">
                  <label for="inputEmail" class="col-sm-2 col-form-label">registration_date</label>
                  <div class="col-sm-10">
                    <input type="date" name="registration_date" value="{{Vehicle.date|date:'y-m-d'}}"class="form-control">
                  </div>
                </div>
                <div class="row mb-3">
                  <label for="inputEmail" class="col-sm-2 col-form-label">color</label>
                  <div class="col-sm-10">
                    <input type="text" name="color" value="{{Vehicle.color}}" class="form-control">
                  </div>
                </div>
                <div class="row mb-3">
                  <label for="inputEmail" class="col-sm-2 col-form-label">insurance_expiry</label>
                  <div class="col-sm-10">
                    <input type="date" name="insurance_expiry" value="{{Vehicle.date|date::'y-m-d'}}" class="form-control">
                  </div>
                </div>
                <div class="row mb-3">
                <fieldset class="row mb-3">
                  <legend class="col-form-label col-sm-2 pt-0">status</legend>
                  <div class="col-sm-10">
                    <div class="form-check">
                      <input class="form-check-input" type="radio" name="status" id="gridRadios1" value="option1" checked>
                      <label class="form-check-label" for="gridRadios1">
                        Active
                      </label>
                    </div>
                    <div class="form-check">
                      <input class="form-check-input" type="radio" name="status" id="gridRadios2" value="option2">
                      <label class="form-check-label" for="gridRadios2">
                        Inactive
                      </label>
                    </div>
                  </div>
                </fieldset> </div>
                </div>
                <div class="row mb-3">
                  <label class="col-sm-2 col-form-label">Submit Button</label>
                  <div class="col-sm-10">
                    <button type="submit" class="btn btn-primary">Submit Form</button>
                  </div>
                </div>

              </form><!-- End General Form Elements -->

            </div>
          </div>

        </div>
      </div>
    </section>

{% endblock %}
