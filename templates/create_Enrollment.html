{% extends "master.html" %}
{% load static %}
{% block content %}

    <div class="pagetitle">
      <h1>Form Elements</h1>
      <nav>
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a href="index.html">Home</a></li>
          <li class="breadcrumb-item">Forms</li>
          <li class="breadcrumb-item active">Elements</li>
        </ol>
      </nav>
    </div><!-- End Page Title -->

    <section class="section">
      <div class="row">
        <div class="col-lg-10">

          <div class="card">
            <div class="card-body">
              <h5 class="card-title">General Form Elements</h5>

              <!-- General Form Elements -->
              <form method="POST">
                {% csrf_token %}
                <div class="row mb-3">
                  <label class="col-sm-2 col-form-label">student</label>
                  <div class="col-sm-10">
                    <select class="form-select" name="wwww" aria-label="Default select example">
                      <option selected>Open this select menu</option>
                      {% for i in stud %}
                      <option value="{{i.id}}">{{i.name}}</option>
                      {% endfor %}
                    </select>
                  </div>
                </div>
                <div class="row mb-3">
                  <label for="inputText" class="col-sm-2 col-form-label">enrollment_no</label>
                  <div class="col-sm-10">
                    <input type="number" name="enrollment_no" class="form-control">
                  </div>
                </div>
                <div class="row mb-3">
                  <label for="inputEmail" class="col-sm-2 col-form-label">student_name</label>
                  <div class="col-sm-10">
                    <input type="text" name="student_name" class="form-control">
                  </div>
                </div>
                <div class="row mb-3">
                  <label for="inputEmail" class="col-sm-2 col-form-label">course_name</label>
                  <div class="col-sm-10">
                    <input type="text" name="course_name" class="form-control">
                  </div>
                </div>
                <div class="row mb-3">
                  <label for="inputEmail" class="col-sm-2 col-form-label">batch</label>
                  <div class="col-sm-10">
                    <input type="text" name="batch" class="form-control">
                  </div>
                </div>
                 <div class="row mb-3">
                  <label for="inputEmail" class="col-sm-2 col-form-label">join_date</label>
                  <div class="col-sm-10">
                    <input type="date" name="join_date" class="form-control">
                  </div>
                </div>
                <fieldset class="row mb-3">
                  <legend class="col-form-label col-sm-2 pt-0">status</legend>
                  <div class="col-sm-10">
                    <div class="form-check">
                      <input class="form-check-input" type="radio" name="gridstatus" id="gridRadios1" value="option1">
                      <label class="form-check-label" for="gridRadios1">
                        Active
                      </label>
                    </div>
                    <div class="form-check">
                      <input class="form-check-input" type="radio" name="gridstatus" id="gridRadios2" value="option2">
                      <label class="form-check-label" for="gridRadios2">
                        Completed
                      </label>
                    </div>
                  </div>
                </fieldset>
                <fieldset class="row mb-3">
                  <legend class="col-form-label col-sm-2 pt-0">payment_status</legend>
                  <div class="col-sm-10">
                    <div class="form-check">
                      <input class="form-check-input" type="radio" name="gridpaymentstatus" id="gridRadios3" value="option1">
                      <label class="form-check-label" for="gridRadios3">
                        Paid
                      </label>
                    </div>
                    <div class="form-check">
                      <input class="form-check-input" type="radio" name="gridpaymentstatus" id="gridRadios4" value="option2">
                      <label class="form-check-label" for="gridRadios4">
                        Unpaid
                      </label>
                    </div>
                  </div>
                </fieldset>



                <div class="row mb-3">
                  <label for="inputEmail" class="col-sm-2 col-form-label">remark</label>
                  <div class="col-sm-10">
                    <input type="text" name="remark" class="form-control">
                  </div>
                </div>
                <fieldset class="row mb-3">
                  <legend class="col-form-label col-sm-2 pt-0">mode</legend>
                  <div class="col-sm-10">
                    <div class="form-check">
                      <input class="form-check-input" type="radio" name="gridRadios" id="gridRadios5" value="option1">
                      <label class="form-check-label" for="gridRadios5">
                        Online
                      </label>
                    </div>
                    <div class="form-check">
                      <input class="form-check-input" type="radio" name="gridRadios" id="gridRadios6" value="option2">
                      <label class="form-check-label" for="gridRadios6">
                        Offline
                      </label>
                    </div>
                  </div>
                </fieldset>
                <div class="row mb-3">
                  <label class="col-sm-2 col-form-label">Submit Button</label>
                  <div class="col-sm-10">
                    <button type="submit" class="btn btn-primary">Submit Form</button>
                  </div>
                </div>

              </form><!-- End General Form Elements -->

            </div>
          </div>

        </div>
      </div>
    </section>

{% endblock %}
