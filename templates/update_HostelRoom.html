{% extends "master.html" %}
{% load static %}
{% block content %}

    <div class="pagetitle">
      <h1>Form Elements</h1>
      <nav>
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a href="index.html">Home</a></li>
          <li class="breadcrumb-item">Forms</li>
          <li class="breadcrumb-item active">Elements</li>
        </ol>
      </nav>
    </div><!-- End Page Title -->

    <section class="section">
      <div class="row">
        <div class="col-lg-10">

          <div class="card">
            <div class="card-body">
              <h5 class="card-title">General Form Elements</h5>

              <!-- General Form Elements -->
              <form method="POST">
                {% csrf_token %}
                <div class="row mb-3">
                  <label for="inputText" class="col-sm-2 col-form-label">room_no</label>
                  <div class="col-sm-10">
                    <input type="number" name="room_no" value="{{HostelRoom.room_no}}" class="form-control">
                  </div>
                </div>
                <div class="row mb-3">
                  <label for="inputEmail" class="col-sm-2 col-form-label">block</label>
                  <div class="col-sm-10">
                    <input type="text" name="block" value="{{HostelRoom.block}}" class="form-control">
                  </div>
                </div>
                <div class="row mb-3">
                  <label for="inputEmail" class="col-sm-2 col-form-label">floor</label>
                  <div class="col-sm-10">
                    <input type="unique" name="floor" value="{{HostelRoom.floor}}" class="form-control">
                  </div>
                </div>
                <div class="row mb-3">
                  <label for="inputEmail" class="col-sm-2 col-form-label">capacity</label>
                  <div class="col-sm-10">
                    <input type="number" name="capacity" value="{{HostelRoom.capacity}}" class="form-control">
                  </div>
                </div>
                 <div class="row mb-3">
                  <label for="inputEmail" class="col-sm-2 col-form-label">occupied</label>
                  <div class="col-sm-10">
                    <input type="number" name="occupied" value="{{HostelRoom.occupied}}" class="form-control">
                  </div>
                </div>
                
                <fieldset class="row mb-3">
                  <legend class="col-form-label col-sm-2 pt-0">Room Type</legend>
                  <div class="col-sm-10">
                    <div class="form-check">
                      <input class="form-check-input" type="radio" name="Room Type" id="gridRadios1" value="option1" checked>
                      <label class="form-check-label" for="gridRadios1">
                        AC
                      </label>
                    </div>
                    <div class="form-check">
                      <input class="form-check-input" type="radio" name="Room Type" id="gridRadios2" value="option2">
                      <label class="form-check-label" for="gridRadios2">
                        Non-AC
                      </label>
                    </div>
                  </div>
                </fieldset>
                <div class="row mb-3">
                  <label for="inputEmail" class="col-sm-2 col-form-label">price</label>
                  <div class="col-sm-10">
                    <input type="unique" name="price" class="form-control">
                  </div>
                </div>
                <fieldset class="row mb-3">
                  <legend class="col-form-label col-sm-2 pt-0">availability</legend>
                  <div class="col-sm-10">
                    <div class="form-check">
                      <input class="form-check-input" type="radio" name="availability" id="gridRadios3" value="option1" checked>
                      <label class="form-check-label" for="gridRadios3">
                        Yes
                      </label>
                    </div>
                    <div class="form-check">
                      <input class="form-check-input" type="radio" name="availability" id="gridRadios4" value="option2">
                      <label class="form-check-label" for="gridRadios4">
                        No
                      </label>
                    </div>
                  </div>
                </fieldset>
                <fieldset class="row mb-3">
                  <legend class="col-form-label col-sm-2 pt-0">status</legend>
                  <div class="col-sm-10">
                    <div class="form-check">
                      <input class="form-check-input" type="radio" name="status" id="gridRadios5" value="option1" checked>
                      <label class="form-check-label" for="gridRadios5">
                        clean
                      </label>
                    </div>
                    <div class="form-check">
                      <input class="form-check-input" type="radio" name="status" id="gridRadios6" value="option2">
                      <label class="form-check-label" for="gridRadios6">
                        No
                      </label>
                    </div>
                  </div>
                </fieldset>
                <div class="row mb-3">
                  <label class="col-sm-2 col-form-label">Submit Button</label>
                  <div class="col-sm-10">
                    <button type="submit" class="btn btn-primary">Submit Form</button>
                  </div>
                </div>

              </form><!-- End General Form Elements -->

            </div>
          </div>

        </div>
      </div>
    </section>

{% endblock %}
