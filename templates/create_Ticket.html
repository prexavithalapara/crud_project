{% extends "master.html" %}
{% load static %}
{% block content %}

    <div class="pagetitle">
      <h1>Form Elements</h1>
      <nav>
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a href="index.html">Home</a></li>
          <li class="breadcrumb-item">Forms</li>
          <li class="breadcrumb-item active">Elements</li>
        </ol>
      </nav>
    </div><!-- End Page Title -->

    <section class="section">
      <div class="row">
        <div class="col-lg-10">

          <div class="card">
            <div class="card-body">
              <h5 class="card-title">General Form Elements</h5>

              <!-- General Form Elements -->
              <form method="POST">
                {% csrf_token %}
                <div class="row mb-3">
                  <label class="col-sm-2 col-form-label">Event</label>
                  <div class="col-sm-10">
                    <select class="form-select" name="kkk" aria-label="Default select example">
                      <option selected>Open this select menu</option>
                      {% for i in eve %}
                      <option value="{{i.id}}">{{i.title}}</option>
                      {% endfor %}
                    </select>
                  </div>
                </div>
                <div class="row mb-3">
                  <label for="inputText" class="col-sm-2 col-form-label">ticket_no</label>
                  <div class="col-sm-10">
                    <input type="number" name="ticket_no" class="form-control">
                  </div>
                </div>
                <div class="row mb-3">
                  <label for="inputEmail" class="col-sm-2 col-form-label">subject</label>
                  <div class="col-sm-10">
                    <input type="text" name="subject" class="form-control">
                  </div>
                </div>    
                <div class="row mb-3">
                  <label for="inputEmail" class="col-sm-2 col-form-label">description</label>
                  <div class="col-sm-10">
                    <input type="text" name="description" class="form-control">
                  </div>
                </div>
                <div class="row mb-3">
                  <label for="inputEmail" class="col-sm-2 col-form-label">priority</label>
                  <div class="col-sm-10">
                    <select class="form-select" aria-label="Default select example">
                      <option selected>Open this select menu</option>
                      <option value="1">Low</option>
                      <option value="2">Medium</option>
                      <option value="3">High</option>
                    </select>
                  </div>
                </div>  
                <div class="row mb-3">
                  <label for="inputEmail" class="col-sm-2 col-form-label">status</label>
                  <div class="col-sm-10">
                    <input type="text" name="status" class="form-control">
                  </div>
                </div>
                <div class="row mb-3">
                  <label for="inputEmail" class="col-sm-2 col-form-label">created_date</label>
                  <div class="col-sm-10">
                    <input type="date" name="created_date" class="form-control">
                  </div>
                </div>
                <div class="row mb-3">
                  <label for="inputEmail" class="col-sm-2 col-form-label">updated_date</label>
                  <div class="col-sm-10">
                    <input type="date" name="updated_date" class="form-control">
                  </div>
                </div>
                <div class="row mb-3">
                  <label for="inputEmail" class="col-sm-2 col-form-label">assigned_to</label>
                  <div class="col-sm-10">
                    <input type="text" name="assigned_to" class="form-control">
                  </div>
                </div>
                 <fieldset class="row mb-3">
                  <legend class="col-form-label col-sm-2 pt-0">type</legend>
                  <div class="col-sm-10">
                    <div class="form-check">
                      <input class="form-check-input" type="radio" name="type" id="gridRadios1" value="option1" checked>
                      <label class="form-check-label" for="gridRadios1">
                        Bug
                      </label>
                    </div>
                    <div class="form-check">
                      <input class="form-check-input" type="radio" name="type" id="gridRadios2" value="option2">
                      <label class="form-check-label" for="gridRadios2">
                        Support
                      </label>
                    </div>
                  </div>
                <div class="row mb-3">
                  <label class="col-sm-2 col-form-label">Submit Button</label>
                  <div class="col-sm-10">
                    <button type="submit" class="btn btn-primary">Submit Form</button>
                  </div>
                </div>

              </form><!-- End General Form Elements -->

            </div>
          </div>

        </div>
      </div>
    </section>

{% endblock %}
